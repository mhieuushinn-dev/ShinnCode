name: Build Shinn Cheat Chat IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Shinn Cheat Chat v2.0
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Build and Archive App
        run: |
          # Tìm tự động file .xcodeproj hoặc .xcworkspace trong thư mục gốc
          PROJECT_FILE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          fi
          
          echo "Using project/workspace: $PROJECT_FILE"
          
          # Lệnh Archive ứng dụng (bỏ qua ký số để test build tự động không lỗi certificate)
          if [[ "$PROJECT_FILE" == *.xcworkspace ]]; then
            xcodebuild -workspace "$PROJECT_FILE" \
                       -scheme "Shinn Cheat Chat" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath build/ShinnCheatChat.xcarchive \
                       archive \
                       MARKETING_VERSION="2.0" \
                       PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project "$PROJECT_FILE" \
                       -scheme "Shinn Cheat Chat" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath build/ShinnCheatChat.xcarchive \
                       archive \
                       MARKETING_VERSION="2.0" \
                       PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ShinnCheatChat.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ShinnCheatChat-v2.0.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheatChat-v2.0-IPA
          path: build/ShinnCheatChat-v2.0.ipa