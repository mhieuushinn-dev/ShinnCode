# File: .github/workflows/build.yml
# Mục đích: Sinh project Xcode từ project.yml bằng XcodeGen, archive và tạo IPA.
# Yêu cầu: Chạy trên macOS runner, không cần file .xcodeproj sẵn.

name: Build and Archive App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chọn Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Hiển thị Xcode
        run: xcodebuild -version

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Sinh project Xcode
        run: xcodegen generate

      - name: Liệt kê scheme
        run: xcodebuild -project ShinnCheat.xcodeproj -list

      - name: Tạo thư mục build
        run: mkdir -p build

      - name: Archive không ký
        run: |
          xcodebuild \
            -project ShinnCheat.xcodeproj \
            -scheme ShinnCheat \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ShinnCheat.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Kiểm tra archive
        run: |
          if [ ! -d build/ShinnCheat.xcarchive ]; then
            echo "Archive không tồn tại"
            exit 1
          fi
          find build/ShinnCheat.xcarchive -name "*.app" -maxdepth 4

      - name: Tạo IPA
        run: |
          cd build
          mkdir -p Payload
          APP_PATH=$(find ShinnCheat.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Không tìm thấy .app"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r ShinnCheat.ipa Payload
          ls -la

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: build/ShinnCheat.ipa