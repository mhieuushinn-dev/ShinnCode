# File: .github/workflows/build.yml
# Mục đích: Tự động build IPA từ mã nguồn Swift trên GitHub Actions.
# Yêu cầu: Chạy trên macOS runner, dùng xcodebuild archive và export IPA.

name: Build and Archive App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chọn phiên bản Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Hiển thị phiên bản Xcode
        run: xcodebuild -version

      - name: Cài đặt công cụ cần thiết
        run: |
          brew install xcbeautify || true

      - name: Tạo thư mục build
        run: mkdir -p build

      - name: Build archive không ký
        run: |
          xcodebuild \
            -project ShinnCheat.xcodeproj \
            -scheme ShinnCheat \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/ShinnCheat.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive | xcbeautify

      - name: Tạo file IPA từ archive
        run: |
          cd build
          mkdir -p Payload
          cp -R ShinnCheat.xcarchive/Products/Applications/*.app Payload/
          zip -r ShinnCheat.ipa Payload

      - name: Tải lên artifact IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: build/ShinnCheat.ipa