name: Build Shinn Cheat Chat IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Shinn Cheat Chat v2.0
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Auto-generate Xcode Project
        run: |
          # Cài đặt công cụ tạo project tự động XCodeGen nếu chưa có
          brew install xcodegen
          
          # Tạo file cấu hình project.yml tự động từ các file code có sẵn
          cat <<EOF > project.yml
          name: ShinnCheatChat
          options:
            bundleIdPrefix: com.apple.mobile
          targets:
            Shinn Cheat Chat:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: .
                  excludes:
                    - .github
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: "com.apple.mobile.MobileHouseArrest"
                INFOPLIST_FILE: "Info.plist"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
          EOF
          
          # Sinh ra file .xcodeproj từ cấu hình trên
          xcodegen generate
          ls -la

      - name: Build and Archive App
        run: |
          xcodebuild -project ShinnCheatChat.xcodeproj \
                     -scheme "Shinn Cheat Chat" \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/ShinnCheatChat.xcarchive \
                     archive \
                     MARKETING_VERSION="2.0" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ShinnCheatChat.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ShinnCheatChat-v2.0.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheatChat-v2.0-IPA
          path: build/ShinnCheatChat-v2.0.ipa
