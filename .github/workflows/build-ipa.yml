name: Build Shinn Cheat Chat IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Shinn Cheat Chat v2.0
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fix Code & Auto-generate Xcode Project
        run: |
          # 1. Tự động kiểm tra và sửa lỗi cú pháp tại dòng guard let trong PackageCell.swift nếu có
          if [ -f "PackageCell.swift" ]; then
            echo "Đang tiến hành vá lỗi cú pháp trong PackageCell.swift..."
            # Thay thế dòng lỗi bằng dòng an toàn hoặc cú pháp chuẩn
            sed -i '' 's/guard let urlString = item.icon, let u.*/if let urlString = item.icon {/g' PackageCell.swift || true
          fi

          # Tìm các file PackageCell.swift khác trong thư mục con nếu có
          find . -name "PackageCell.swift" -type f | while read file; do
            sed -i '' 's/guard let urlString = item.icon, let u.*/if let urlString = item.icon {/g' "$file" || true
          done

          # 2. Cài đặt xcodegen và tạo project
          brew install xcodegen
          
          cat <<EOF > project.yml
          name: ShinnCheatChat
          options:
            bundleIdPrefix: com.apple.mobile
          targets:
            Shinn Cheat Chat:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: .
                  excludes:
                    - .github
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: "com.apple.mobile.MobileHouseArrest"
                INFOPLIST_FILE: "Info.plist"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
          EOF
          
          xcodegen generate

      - name: Build and Archive App
        run: |
          xcodebuild -project ShinnCheatChat.xcodeproj \
                     -scheme "Shinn Cheat Chat" \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/ShinnCheatChat.xcarchive \
                     archive \
                     MARKETING_VERSION="2.0" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ShinnCheatChat.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ShinnCheatChat-v2.0.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheatChat-v2.0-IPA
          path: build/ShinnCheatChat-v2.0.ipa
