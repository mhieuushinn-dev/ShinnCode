name: Build Shinn Cheat Chat IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Shinn Cheat Chat v2.0
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Archive App
        run: |
          # Tự động tìm file .xcodeproj bất kể nằm ở thư mục gốc hay thư mục con
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          
          echo "Found project file: $PROJECT_FILE"
          
          xcodebuild -project "$PROJECT_FILE" \
                     -scheme "Shinn Cheat Chat" \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/ShinnCheatChat.xcarchive \
                     archive \
                     MARKETING_VERSION="2.0" \
                     PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ShinnCheatChat.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ShinnCheatChat-v2.0.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheatChat-v2.0-IPA
          path: build/ShinnCheatChat-v2.0.ipa
