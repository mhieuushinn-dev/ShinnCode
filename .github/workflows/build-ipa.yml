name: Build Shinn Cheat Chat IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Shinn Cheat Chat v2.0
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Archive App
        run: |
          # Tìm kiếm tường minh file project hoặc workspace
          if [ -d "*.xcworkspace" ]; then
            WORKSPACE_NAME=$(ls -d *.xcworkspace | head -n 1)
            echo "Building using workspace: $WORKSPACE_NAME"
            xcodebuild -workspace "$WORKSPACE_NAME" \
                       -scheme "Shinn Cheat Chat" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath build/ShinnCheatChat.xcarchive \
                       archive \
                       MARKETING_VERSION="2.0" \
                       PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          else
            PROJECT_NAME=$(ls -d *.xcodeproj | head -n 1)
            echo "Building using project: $PROJECT_NAME"
            xcodebuild -project "$PROJECT_NAME" \
                       -scheme "Shinn Cheat Chat" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath build/ShinnCheatChat.xcarchive \
                       archive \
                       MARKETING_VERSION="2.0" \
                       PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ShinnCheatChat.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ShinnCheatChat-v2.0.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheatChat-v2.0-IPA
          path: build/ShinnCheatChat-v2.0.ipa
